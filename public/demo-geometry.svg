<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1764ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7029e9" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b1935" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="500" height="360" rx="16" fill="#f8faff" stroke="#e1e8f5" stroke-width="1.5"/>

  <!-- Прямоугольный треугольник ABC: C(100, 270), B(380, 270), A(100, 80) -->
  <polygon points="100,270 380,270 100,80" fill="url(#triGrad)" stroke="#1764ff" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Знак прямого угла при вершине C -->
  <path d="M100,244 L126,244 L126,270" fill="none" stroke="#e11d48" stroke-width="2.5"/>
  <circle cx="113" cy="257" r="3" fill="#e11d48"/>

  <!-- Вершины -->
  <circle cx="100" cy="80" r="5.5" fill="#1764ff" stroke="#fff" stroke-width="2.5"/>
  <circle cx="100" cy="270" r="5.5" fill="#1764ff" stroke="#fff" stroke-width="2.5"/>
  <circle cx="380" cy="270" r="5.5" fill="#1764ff" stroke="#fff" stroke-width="2.5"/>

  <!-- Подписи вершин -->
  <text x="82" y="74" font-family="Manrope, sans-serif" font-size="20" font-weight="800" fill="#0b1935">A</text>
  <text x="74" y="285" font-family="Manrope, sans-serif" font-size="20" font-weight="800" fill="#0b1935">C</text>
  <text x="395" y="285" font-family="Manrope, sans-serif" font-size="20" font-weight="800" fill="#0b1935">B</text>

  <!-- Стороны: a, b, c -->
  <text x="66" y="180" font-family="Georgia, serif" font-size="20" font-style="italic" font-weight="700" fill="#2563eb">b = 6</text>
  <text x="228" y="304" font-family="Georgia, serif" font-size="20" font-style="italic" font-weight="700" fill="#2563eb">a = 8</text>
  <text x="254" y="160" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="800" fill="#7c3aed">c = ?</text>

  <!-- Формула Пифагора внизу -->
  <rect x="140" y="24" width="220" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="250" y="48" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">c² = a² + b²</text>
</svg>
