<svg viewBox="0 0 100 68" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich luminous sapphire-blue brain gradient for light background -->
    <linearGradient id="brainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Specular highlight sheen on top brain lobes -->
    <linearGradient id="topSheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Diagonal glass reflection -->
    <linearGradient id="crescentSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Clean light background tile -->
  <rect width="100" height="68" rx="11" fill="#ffffff"/>

  <!-- 1. BRAIN SILHOUETTE -->
  <path d="
    M 50 4.5
    C 58 4.5, 63.5 7.5, 67 12.5
    C 75 11, 83.5 16, 85.5 24
    C 92.5 27.5, 94.5 35.5, 91 42.5
    C 93.5 49, 89.5 57, 83 61
    C 77 64.5, 71 63, 68 59
    C 67 56, 68 52, 69.5 49
    C 64 51.5, 57 52.5, 50 52.5
    C 43 52.5, 36 51.5, 30.5 49
    C 32 52, 33 56, 32 59
    C 29 63, 23 64.5, 17 61
    C 10.5 57, 6.5 49, 9 42.5
    C 5.5 35.5, 7.5 27.5, 14.5 24
    C 16.5 16, 25 11, 33 12.5
    C 36.5 7.5, 42 4.5, 50 4.5
    Z
  " fill="url(#brainBlue)"/>

  <!-- Top Sheen Layer -->
  <path d="
    M 50 4.5
    C 58 4.5, 63.5 7.5, 67 12.5
    C 75 11, 83.5 16, 85.5 24
    C 92.5 27.5, 94.5 35.5, 91 42.5
    C 79 33, 65 29, 50 29
    C 35 29, 21 33, 9 42.5
    C 5.5 35.5, 7.5 27.5, 14.5 24
    C 16.5 16, 25 11, 33 12.5
    C 36.5 7.5, 42 4.5, 50 4.5
    Z
  " fill="url(#topSheen)"/>

  <!-- Lower right crescent gloss highlight -->
  <path d="
    M 68 49
    C 75 47, 85 41, 89 36
    C 92 41, 91 48, 86 53
    C 80 50, 73 49, 68 49
    Z
  " fill="url(#crescentSheen)"/>

  <!-- Lower left crescent gloss highlight -->
  <path d="
    M 32 49
    C 25 47, 15 41, 11 36
    C 8 41, 9 48, 14 53
    C 20 50, 27 49, 32 49
    Z
  " fill="url(#crescentSheen)"/>

  <!-- 2. OPEN BOOK AT BASE (Crisp pure white negative-space cutouts) -->
  <!-- Main open book body -->
  <path d="
    M 24 47.5
    C 32 45.5, 41 47.5, 47.5 52.5
    L 46.5 66.5
    L 50 62.5
    L 53.5 66.5
    L 52.5 52.5
    C 59 47.5, 68 45.5, 76 47.5
    L 76 64.5
    C 67.5 64.5, 59.5 63.5, 53.5 60.5
    L 50 62.5
    L 46.5 60.5
    C 40.5 63.5, 32.5 64.5, 24 64.5
    Z
  " fill="#ffffff"/>

  <!-- Flying Page Swooshes (Pages lifting off the book into the brain) -->
  <!-- Left Flying Page -->
  <path d="
    M 46.5 53.5
    C 42 48.5, 35 44, 27.5 40.5
    C 33 44, 38.5 48.5, 42 54.5
    C 43.5 54.5, 45 54, 46.5 53.5
    Z
  " fill="#ffffff"/>

  <!-- Right Flying Page -->
  <path d="
    M 53.5 53.5
    C 58 48.5, 65 44, 72.5 40.5
    C 67 44, 61.5 48.5, 58 54.5
    C 56.5 54.5, 55 54, 53.5 53.5
    Z
  " fill="#ffffff"/>

  <!-- 3. MATHEMATICAL SYMBOLS IN CRISP WHITE -->

  <!-- Top Center: Division (÷) -->
  <circle cx="50" cy="11.5" r="2.5" fill="#ffffff"/>
  <rect x="42" y="16.5" width="16" height="4.6" rx="1.5" fill="#ffffff"/>
  <circle cx="50" cy="26" r="2.5" fill="#ffffff"/>

  <!-- Left: Minus (-) -->
  <rect x="23" y="29.5" width="16.5" height="4.8" rx="1.5" fill="#ffffff"/>

  <!-- Center: Plus (+) -->
  <rect x="47.5" y="33.5" width="5" height="15.5" rx="1.5" fill="#ffffff"/>
  <rect x="42.2" y="38.7" width="15.6" height="5.1" rx="1.5" fill="#ffffff"/>

  <!-- Right: Multiplication (× / X) -->
  <g transform="translate(68.5, 34.5)">
    <rect x="-8.2" y="-2.5" width="16.4" height="5" rx="1.5" fill="#ffffff" transform="rotate(45)"/>
    <rect x="-8.2" y="-2.5" width="16.4" height="5" rx="1.5" fill="#ffffff" transform="rotate(-45)"/>
  </g>
</svg>