<svg viewBox="0 0 100 132" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Lightbulb Outline in Royal Blue -->
  <path d="
    M 36 102
    C 30 96, 26 87, 24 78
    C 20 62, 22 43, 33 28
    C 43 14, 57 14, 67 28
    C 78 43, 80 62, 76 78
    C 74 87, 70 96, 64 102
    C 59 108, 56 114, 50 114
    C 44 114, 41 108, 36 102
    Z
  " stroke="#1d61e6" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Screw Base / Cap -->
  <path d="M 40 118 C 40 128, 60 128, 60 118 Z" fill="#1d61e6"/>

  <!-- 1. GREEN LOBE (Top-Left: Minus -) -->
  <path d="
    M 38 29
    C 42 25, 47 23, 49 23
    C 48 34, 45 46, 39 56
    C 33 56, 28 52, 28 44
    C 28 37, 32 32, 38 29
    Z
  " fill="#05c46b"/>
  <!-- Minus - -->
  <rect x="31" y="38" width="11" height="4" rx="2" fill="#ffffff"/>

  <!-- 2. SKY BLUE LOBE (Top-Center: Division ÷) -->
  <path d="
    M 53 22
    C 56 22, 60 25, 62 28
    C 60 38, 55 49, 49 61
    C 46 60, 43 57, 44 49
    C 45 40, 49 29, 53 22
    Z
  " fill="#0091ff"/>
  <!-- Division ÷ -->
  <circle cx="53" cy="33" r="1.9" fill="#ffffff"/>
  <rect x="48.5" y="37" width="9" height="3.2" rx="1.6" fill="#ffffff"/>
  <circle cx="53" cy="44" r="1.9" fill="#ffffff"/>

  <!-- 3. YELLOW LOBE (Top-Right: Plus +) -->
  <path d="
    M 66 31
    C 70 36, 73 42, 73 48
    C 73 54, 69 57, 63 57
    C 59 50, 58 41, 60 34
    C 62 32, 64 31, 66 31
    Z
  " fill="#f59e0b"/>
  <!-- Plus + -->
  <rect x="63" y="42" width="8" height="3.2" rx="1.6" fill="#ffffff"/>
  <rect x="65.4" y="39.6" width="3.2" height="8" rx="1.6" fill="#ffffff"/>

  <!-- 4. RED LOBE (Middle: Multiplication × / X) -->
  <path d="
    M 34 60
    C 42 56, 52 61, 61 62
    C 67 62, 72 65, 70 73
    C 66 81, 60 87, 56 93
    C 52 89, 49 80, 44 75
    C 38 70, 33 67, 34 60
    Z
  " fill="#ff2a44"/>
  <!-- Multiplication × -->
  <g transform="translate(54, 75)">
    <rect x="-5.2" y="-1.6" width="10.4" height="3.2" rx="1.6" fill="#ffffff" transform="rotate(45)"/>
    <rect x="-5.2" y="-1.6" width="10.4" height="3.2" rx="1.6" fill="#ffffff" transform="rotate(-45)"/>
  </g>

  <!-- 5. PURPLE LOBE (Bottom: Equals =) -->
  <path d="
    M 41 80
    C 47 83, 51 90, 52 97
    C 51 104, 46 108, 42 107
    C 38 105, 36 98, 37 92
    C 37 86, 39 82, 41 80
    Z
  " fill="#7c3aed"/>
  <!-- Equals = -->
  <rect x="40.5" y="90" width="8" height="2.6" rx="1.3" fill="#ffffff"/>
  <rect x="40.5" y="95" width="8" height="2.6" rx="1.3" fill="#ffffff"/>
</svg>