<!doctype html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grafiku zīmētājs — MathTasks</title>
  <meta name="description" content="Interaktīvs funkcijas grafiks pa visu ekrānu: mērogs ar ritentiņu un diviem pirkstiem, pārvietošana ar peli un pirkstu, līdz trim funkcijām vienlaikus." />
  <link rel="canonical" href="https://mathtasks.lv/plotter" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MathTasks" />
  <meta property="og:title" content="Grafiku zīmētājs — MathTasks" />
  <meta property="og:description" content="Interaktīvs funkcijas grafiks pa visu ekrānu: mērogs ar ritentiņu un diviem pirkstiem, pārvietošana ar peli un pirkstu, līdz trim funkcijām vienlaikus." />
  <meta property="og:url" content="https://mathtasks.lv/plotter" />
  <meta property="og:image" content="https://mathtasks.lv/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://mathtasks.lv/og-cover.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/nachala.css" />
  <script src="/theme-init.js?v=20261120-1"></script>
  <script src="/nachala-clean.js" defer></script>
  <script src="/i18n.js?v=20261121-21"></script>
</head>
<body class="plot-page">
  <header class="admin-topbar">
    <div class="topbar-brand-wrap">
      <a class="brand nb-logo" href="/" aria-label="MathTasks">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="20" width="18" height="18" fill="var(--fb)"/><circle cx="29" cy="11" r="9" fill="var(--fy)"/><path d="M22 38 L38 38 L30 22 Z" fill="var(--fr)"/></svg>
        <span>MathTasks</span>
      </a>
      <a class="topbar-home-btn" href="/" aria-label="На главную" data-i18n-aria="nav_to_home"><svg class="topbar-home-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="topbar-home-label" data-i18n="nav_to_home">На главную</span></a>
    </div>
    <span class="admin-badge" data-i18n="plotter_badge">📈 Графопостроитель</span>

    <div class="trainer-top-actions">
      <button type="button" class="nav-btn-link" id="plot-copy-link" data-i18n="plotter_copy_link">🔗 Скопировать ссылку</button>

      <div class="lang-switcher" role="group" aria-label="Выбор языка" data-i18n-aria="lang_switcher">
        <button class="lang-btn" data-lang="lv" type="button" aria-label="Latviešu valoda">LV</button>
        <button class="lang-btn" data-lang="ru" type="button" aria-label="Русский язык">RU</button>
      </div>

      <button class="theme-switch nb-icon-btn nb-theme-btn" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Переключить тему" data-i18n-aria="theme_toggle" title="Переключить тему" data-i18n-title="theme_toggle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="plot-main">
    <form class="plot-bar" id="plot-form" autocomplete="off">
      <span class="plotter-prefix">y =</span>
      <input type="text" id="plot-expr" class="plot-expr" value="x^2 - 4" placeholder="x^2 - 4; sin(x); 1/x" aria-label="Формула функции" data-i18n-aria="formula_input" spellcheck="false" />
      <button type="submit" class="primary-button" data-i18n="plotter_draw">Построить</button>
      <div class="plot-legend" id="plot-legend" aria-live="polite"></div>
    </form>

    <div class="plot-presets">
      <span class="plotter-presets-label" data-i18n="plotter_presets">Примеры:</span>
      <button type="button" class="plotter-chip" data-fn="x^2 - 4">y = x² − 4</button>
      <button type="button" class="plotter-chip" data-fn="2*x - 3">y = 2x − 3</button>
      <button type="button" class="plotter-chip" data-fn="1/x">y = 1/x</button>
      <button type="button" class="plotter-chip" data-fn="sin(x); cos(x)">sin x; cos x</button>
      <button type="button" class="plotter-chip" data-fn="sqrt(x)">y = √x</button>
      <button type="button" class="plotter-chip" data-fn="lg(x)">y = lg x</button>
      <button type="button" class="plotter-chip" data-fn="x^3 - 3*x">y = x³ − 3x</button>
    </div>

    <div class="plot-stage">
      <canvas id="plot-canvas" tabindex="0" role="img" aria-label="График функции" data-i18n-aria="graph_canvas"></canvas>
      <div class="plot-readout" id="plot-readout"></div>
      <div class="plotter-zoom plot-zoom">
        <button type="button" id="plot-zoom-in" title="Увеличить" data-i18n-title="zoom_in">+</button>
        <button type="button" id="plot-zoom-out" title="Уменьшить" data-i18n-title="zoom_out">−</button>
        <button type="button" id="plot-zoom-reset" title="Сброс масштаба" data-i18n-title="zoom_reset">1:1</button>
        <button type="button" id="plot-fullscreen" aria-pressed="false" title="Во весь экран" data-i18n-title="plot_fullscreen" aria-label="Во весь экран" data-i18n-aria="plot_fullscreen"><svg class="plot-fs-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path class="fs-open" d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/><path class="fs-close" d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg></button>
      </div>
    </div>

    <div class="plot-foot">
      <span class="plot-roots" id="plot-roots"></span>
      <span class="plot-hint" data-i18n="plotter_hint">Тяните мышью или пальцем, колесо и щипок — масштаб, двойной щелчок — сброс. Несколько функций разделяйте точкой с запятой.</span>
    </div>
  </main>

  <script src="/math-keyboard.js?v=20260917-2"></script>
  <script src="/plotter.js?v=20261116-1"></script>
  <script src="/plotter-page.js?v=20261119-1"></script>
</body>
</html>
