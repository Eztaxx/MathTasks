  <meta property="og:description" content="Интерактивный график функции во весь экран: масштаб колесом и щипком, перетаскивание мышью и пальцем, до трёх функций сразу." />

<body class="plot-page">
  <header class="admin-topbar">
    <div class="topbar-brand-wrap">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img">
            <path d="M1.6 29.8C9.4 27.2 17.4 26.2 24 27.2V43.4C17.4 42.4 9.4 43.4 1.6 46Z" fill="#12306e"/>
            <path d="M46.4 29.8C38.6 27.2 30.6 26.2 24 27.2V43.4C30.6 42.4 38.6 43.4 46.4 46Z" fill="#1a3f8f"/>
            <path d="M4 31C10.4 29 17 28.2 22.8 29V40.8C17 40 10.4 40.8 4 42.8Z" fill="#eaf1ff"/>
            <path d="M44 31C37.6 29 31 28.2 25.2 29V40.8C31 40 37.6 40.8 44 42.8Z" fill="#d7e5ff"/>
            <path d="M7.4 33.9 19 32.9M7.4 36.7 19 35.7M40.6 33.9 29 32.9M40.6 36.7 29 35.7" stroke="#5a92ff" stroke-width="1.15" stroke-linecap="round"/>
            <path d="M10 28.5v11.2l2.4-2.4 2.4 2.4V28.1Z" fill="#7fb0ff"/>
            <path d="M15 15v9.6c0 4 18 4 18 0V15Z" fill="#12306e"/>
            <path d="M24 5 45.5 13.4 24 21.8 2.5 13.4Z" fill="#1a3f8f"/>
            <path d="M24 5 45.5 13.4 24 21.8Z" fill="#27529f"/>
            <path d="M24 13.4 39.8 15.5v5.9" fill="none" stroke="#7fb0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M39.8 20.8c-2 0-2.3 2.5-1.9 5.4.6.7 3.2.7 3.8 0 .4-2.9.1-5.4-1.9-5.4Z" fill="#7fb0ff"/>
          </svg>
        </span>
        <span class="label"><span class="brand-math">Math</span><span class="brand-tasks">Tasks</span></span>
      </a>
      <a class="topbar-home-btn" href="/" aria-label="На главную" data-i18n-aria="nav_to_home"><svg class="topbar-home-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="topbar-home-label" data-i18n="nav_to_home">На главную</span></a>
    </div>
    <span class="admin-badge" data-i18n="plotter_badge">📈 Графопостроитель</span>

    <div class="trainer-top-actions">
      <button type="button" class="nav-btn-link" id="plot-copy-link" data-i18n="plotter_copy_link">🔗 Скопировать ссылку</button>

      <div class="lang-switcher" role="group" aria-label="Выбор языка" data-i18n-aria="lang_switcher">
        <button class="lang-btn" data-lang="lv" type="button" aria-label="Latviešu valoda">LV</button>
        <button class="lang-btn" data-lang="ru" type="button" aria-label="Русский язык">RU</button>
      </div>

      <button class="theme-switch" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Переключить тему" data-i18n-aria="theme_toggle" title="Переключить тему" data-i18n-title="theme_toggle">
        <span class="theme-switch-track" aria-hidden="true">
          <span class="theme-switch-thumb">
            <svg class="theme-switch-sun" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="theme-switch-moon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </span>
        </span>
      </button>
    </div>
  </header>

  <main class="plot-main">
    <form class="plot-bar" id="plot-form" autocomplete="off">
      <span class="plotter-prefix">y =</span>
      <input type="text" id="plot-expr" class="plot-expr" value="x^2 - 4" placeholder="x^2 - 4; sin(x); 1/x" aria-label="Формула функции" data-i18n-aria="formula_input" spellcheck="false" />
      <button type="submit" class="primary-button" data-i18n="plotter_draw">Построить</button>
      <div class="plot-legend" id="plot-legend" aria-live="polite"></div>
    </form>

    <div class="plot-presets">
      <span class="plotter-presets-label" data-i18n="plotter_presets">Примеры:</span>
      <button type="button" class="plotter-chip" data-fn="x^2 - 4">y = x² − 4</button>
      <button type="button" class="plotter-chip" data-fn="2*x - 3">y = 2x − 3</button>
      <button type="button" class="plotter-chip" data-fn="1/x">y = 1/x</button>
      <button type="button" class="plotter-chip" data-fn="sin(x); cos(x)">sin x; cos x</button>
      <button type="button" class="plotter-chip" data-fn="sqrt(x)">y = √x</button>
      <button type="button" class="plotter-chip" data-fn="lg(x)">y = lg x</button>
      <button type="button" class="plotter-chip" data-fn="x^3 - 3*x">y = x³ − 3x</button>
    </div>

    <div class="plot-stage">
      <canvas id="plot-canvas" tabindex="0" role="img" aria-label="График функции" data-i18n-aria="graph_canvas"></canvas>
      <div class="plot-readout" id="plot-readout"></div>
      <div class="plotter-zoom plot-zoom">
        <button type="button" id="plot-zoom-in" title="Увеличить" data-i18n-title="zoom_in">+</button>
        <button type="button" id="plot-zoom-out" title="Уменьшить" data-i18n-title="zoom_out">−</button>
        <button type="button" id="plot-zoom-reset" title="Сброс масштаба" data-i18n-title="zoom_reset">1:1</button>
      </div>
    </div>

    <div class="plot-foot">
      <span class="plot-roots" id="plot-roots"></span>
      <span class="plot-hint" data-i18n="plotter_hint">Тяните мышью или пальцем, колесо и щипок — масштаб, двойной щелчок — сброс. Несколько функций разделяйте точкой с запятой.</span>
    </div>
  </main>

  <script src="/math-keyboard.js?v=20260917-2"></script>
  <script src="/plotter.js?v=20260916-2"></script>
  <script src="/plotter-page.js?v=20260916-1"></script>
</body>
</html>
