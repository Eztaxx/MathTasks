name: Тесты

# Автосборка Cloudflare тесты не запускает, поэтому они идут здесь: на каждый пуш в master
# и на каждый запрос на слияние. Красный значок — повод посмотреть до того, как заметят читатели.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
